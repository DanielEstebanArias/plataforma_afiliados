name: superapp_mobile
description: Metadata driven tenant-isolated mobile application.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  flutter_appauth: ^9.0.1
  image_picker: ^1.1.2
  native_exif: ^0.6.0
  record: ^6.0.0
  location: ^8.0.0
  flutter_nfc_kit: ^3.6.0
  mobile_scanner: ^6.0.7
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  socket_io_client: ^3.0.2
  mqtt_client: ^10.8.0
  webview_flutter: ^4.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
