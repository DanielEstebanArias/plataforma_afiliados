name: Verify engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DATABASE_URL: postgresql://runtime:unused@localhost:5432/superapp
      DIRECT_DATABASE_URL: postgresql://postgres:unused@localhost:5432/superapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate && npx prisma generate
      - run: npm run build && npm test
      - run: bash -n infra/compiler_runner.sh infra/init-db.sh
      - run: python3 -m py_compile infra/configure_mobile.py
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - working-directory: mobile
        run: flutter pub get && flutter analyze && flutter test
  database:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      POSTGRES_PASSWORD: integration_owner
      RUNTIME_DB_PASSWORD: integration_runtime
      DATABASE_URL: postgresql://superapp_runtime:integration_runtime@localhost:5432/superapp
      DIRECT_DATABASE_URL: postgresql://postgres:integration_owner@localhost:5432/superapp
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:integration_owner@localhost:5432/superapp
      TEST_RUNTIME_DATABASE_URL: postgresql://superapp_runtime:integration_runtime@localhost:5432/superapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cp .env.example .env && docker compose up -d --wait db redis
      - run: npm ci && npx prisma generate && npx prisma migrate deploy
      - run: npm run test:integration
      - if: always()
        run: docker compose down -v
